<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vision | Controle de EPIs e Itens</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h2>Vision SST</h2>
    <p>Controle de EPIs e Itens</p>
    <div class="field" id="authEmailField"><label>E-mail</label><input id="authEmail" type="email" autocomplete="username" placeholder="seu@email.com"></div>
    <div class="field" id="authPasswordField"><label>Senha</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="Sua senha"></div>
    <div class="field" id="authEmpresaField" style="display:none"><label>Empresa / Fazenda</label><select id="authEmpresa"><option value="">Selecione...</option></select></div>
    <div id="authError" class="auth-error"></div>
    <button id="authLoginBtn" class="btn btn-primary" type="button" style="width:100%">Entrar</button>
    <button id="authTrocarUsuarioBtn" class="btn btn-secondary" type="button" style="width:100%;margin-top:8px;display:none">Trocar usuário</button>
  </div>
</div>

<div class="app auth-hidden" id="mainApp">
  <aside class="sidebar">
    <div class="brand">Vision<small>Controle de EPIs e Itens · arquivo único</small></div>
    <div class="nav">
      <div class="nav-group"><button class="nav-parent" type="button"><span>Cadastros</span><span class="arrow">▶</span></button><div class="nav-children"><button class="nav-child active" data-page="matriz">Matriz Cargo × Itens</button><button class="nav-child" data-page="itens">Cadastro de Itens</button><button class="nav-child" data-page="colaboradores">Colaboradores</button></div></div>
      <div class="nav-group"><button class="nav-parent" type="button"><span>Estoque</span><span class="arrow">▶</span></button><div class="nav-children"><button class="nav-child" data-page="entrada">Entrada</button><button class="nav-child" data-page="saida">Entrega / Saída</button><button class="nav-child" data-page="estoque">Estoque Atual</button><button class="nav-child" data-page="historico">Histórico</button></div></div>
      <div class="nav-group"><button class="nav-parent" type="button"><span>Admissão</span><span class="arrow">▶</span></button><div class="nav-children"><button class="nav-child" data-page="admissao">Carga Inicial</button></div></div>
      <div class="nav-group"><button class="nav-parent" type="button"><span>Documentos</span><span class="arrow">▶</span></button><div class="nav-children"><button class="nav-child" data-page="fichas">Fichas de EPI</button><button class="nav-child" data-page="fichasOutros">Uniformes e Outros Itens</button></div></div>
      <div class="nav-group"><button class="nav-parent" type="button"><span>Gerencial</span><span class="arrow">▶</span></button><div class="nav-children"><button class="nav-child" data-page="programacaoTrocas">Projeções</button><button class="nav-child nav-soon" type="button">Dashboard</button></div></div>
    </div>
  </aside>
  <main class="content">
    <div class="topbar"><div><h1 id="pageTitle">Matriz Cargo × Itens</h1><p id="pageSubtitle">Defina o que cada cargo precisa receber.</p></div><div class="client"><span class="muted">Cliente:</span><input id="clientName" placeholder="Nome da fazenda/empresa" /><span id="authUserLabel" class="auth-user"></span><button id="authLogoutBtn" class="btn btn-light" type="button">Sair</button></div></div>
    <section id="matriz" class="page active"><div class="stats"><div class="stat"><span>Cargos cadastrados</span><b id="statCargos">0</b></div><div class="stat"><span>Itens na base</span><b id="statItens">0</b></div><div class="stat"><span>Vínculos Cargo × Item</span><b id="statVinculos">0</b></div></div><div class="card"><div class="toolbar"><div class="field"><label>Cargo</label><select id="cargoSelect"></select></div></div></div></section>
  </main>
</div>

<!-- O restante da interface é montado pelo app.js. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="cotacoes.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
